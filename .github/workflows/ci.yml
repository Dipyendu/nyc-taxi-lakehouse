# Lint, unit tests and an offline dbt parse (the same steps as `make ci`), then a secret scan of every file.
# Actions are pinned to release commits (checkout v7.0.1, setup-uv v10.3.3).
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: make ci
      - run: scripts/secret_scan.sh --all
