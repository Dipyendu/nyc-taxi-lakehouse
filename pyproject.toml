[project]
name = "taxi"
version = "0.1.0"
description = "NYC yellow-taxi batch lakehouse on Databricks: ingest, Delta bronze/silver, dbt gold, Airflow"
authors = [
    { name = "Dipyendu Das", email = "dipyendudas5@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "databricks-sdk>=0.117.0",
    "databricks-sql-connector>=4.4.0",
    "dbt-core>=1.12.6",
    "dbt-databricks>=1.13.0",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110
